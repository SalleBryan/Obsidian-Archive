name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests and CDK synth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: red-rising-cdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/unit -q

      # Synthesizes without GOOGLE_CLIENT_ID, so the Google IdP block (which
      # resolves a Secrets Manager ARN at synth time) is skipped and no AWS
      # credentials are needed.
      - name: Synthesize CloudFormation
        run: |
          npm install -g aws-cdk
          cdk synth --quiet

  frontend:
    name: Frontend build and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Fails the build on a new high or critical advisory in a shipped
      # dependency. Known outstanding: epubjs pulls a vulnerable @xmldom/xmldom
      # and the only upstream fix is a breaking major bump.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
